<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Click</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="top">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M4.5 3.2 19.6 10.4l-6.5 2.2-2.4 6.6z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </span>
    <span class="brand">Next Click</span>
  </header>

  <!-- 1. Say what you want -->
  <section id="ask">
    <label for="goal">What do you want to do?</label>
    <p class="hint">Tell me in your own words. I'll show you the whole path, then the next button to press.</p>
    <textarea id="goal" rows="3" placeholder="A website for my shop, a poster in Canva, a budget in Google Sheets…"></textarea>
    <div class="chips" aria-label="Ideas">
      <button type="button" class="chip" data-goal="I want to build a website">Build a website</button>
      <button type="button" class="chip" data-goal="I want to make a poster">Make a poster</button>
      <button type="button" class="chip" data-goal="I want to make a budget sheet">Make a budget</button>
      <button type="button" class="chip" data-goal="I want to automate something">Automate a task</button>
    </div>
    <button id="go" class="big primary">Go</button>
  </section>

  <p id="goalLine" class="goal-line" hidden>
    <span class="goal-chip"><span class="goal-k">Your goal</span><strong id="goalText"></strong></span>
    <button id="change" class="link">Change</button>
  </p>

  <!-- The best tool for this job (shown once we know what you are making) -->
  <section id="toolCard" class="toolcard" hidden>
    <span id="toolBadge" class="tool-badge" aria-hidden="true"></span>
    <div class="tool-body">
      <p class="tool-k">Best tool for this</p>
      <p id="toolName" class="tool-name"></p>
      <p id="toolWhy" class="tool-why"></p>
    </div>
    <button id="toolOpen" class="pill" type="button">Open</button>
  </section>

  <!-- 2. The whole path, from zero to done -->
  <section id="roadmap" class="roadmap" hidden>
    <button id="roadHead" class="road-head" type="button" aria-expanded="true">
      <span class="road-title" id="roadTitle">Your path</span>
      <span class="road-progress" id="roadProgress"></span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <ol id="roadList" class="road-list"></ol>
  </section>

  <ul id="doneList" class="done-list" hidden></ul>

  <!-- 3. The one thing to do right now -->
  <section id="now" class="now" hidden>
    <p id="nowLabel" class="now-label" hidden></p>
    <p id="nowText" class="now-text"></p>
    <p id="nowNote" class="now-note" hidden></p>
    <button id="nowPrimary" class="big primary" hidden></button>
    <div id="copyBox" class="copybox" hidden>
      <p class="copy-hint">Press Copy, then paste it where I tell you.</p>
      <pre id="copyText"></pre>
      <button id="copyBtn" class="pill">Copy</button>
    </div>
    <div class="now-links">
      <button id="hear" class="ghost" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M17.8 6.2a8.2 8.2 0 0 1 0 11.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Read it to me
      </button>
      <button id="lost" class="ghost">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5M12 16.6v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        I'm lost
      </button>
    </div>
  </section>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <!-- 4. Things you asked, and my answers -->
  <div id="thread" class="thread" hidden aria-live="polite"></div>

  <!-- 5. Ask me anything -->
  <form id="dock" class="dock" hidden autocomplete="off">
    <textarea id="chatInput" rows="1" maxlength="500" placeholder="Ask me anything…" aria-label="Ask me anything"></textarea>
    <button id="chatSend" class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l15-7-4.5 15-3-6.2z" fill="#fff" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </form>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
